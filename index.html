/* ------------------------------------------------ ligações do painel gerencial */
function setPath(obj, caminho, valor) {
  const p = caminho.split('.');
  let alvo = obj;
  for (let i = 0; i < p.length - 1; i++) { const k = /^\d+$/.test(p[i]) ? Number(p[i]) : p[i]; if (alvo[k] == null) alvo[k] = {}; alvo = alvo[k]; }
  const ult = /^\d+$/.test(p[p.length - 1]) ? Number(p[p.length - 1]) : p[p.length - 1];
  alvo[ult] = valor;
  return obj;
}

function ligaCampos() {
  $$('[data-set]').forEach(el => {
    el.addEventListener('change', async () => {
      const tipo = el.dataset.tipo || 'texto';
      let v = el.value;
      if (tipo === 'num') v = parseNum(v);
      else if (tipo === 'int') v = Math.max(0, Math.round(parseNum(v)));
      else if (tipo === 'pctFrac') v = parseNum(v) / 100;
      await Store.salvaCore(core => setPath(core, el.dataset.set, v));
      App.render();
    });
  });
}

async function acaoLancamento(ac, id) {
  const l = Store.lancamentos.find(x => x.id === id);
  if (!l) return;
  if (ac === 'aprovar') { await Store.gravaLancamento(Object.assign({}, l, { status: 'aprovado', obs: '' })); toast('Lançamento aprovado.', 'good'); }
  else if (ac === 'pendente') { await Store.gravaLancamento(Object.assign({}, l, { status: 'pendente' })); toast('Voltou para análise.'); }
  else if (ac === 'reembolsado') { await Store.gravaLancamento(Object.assign({}, l, { reembolso: Object.assign({}, l.reembolso, { pago: true, pagoEm: hoje() }) })); toast('Reembolso marcado como pago.', 'good'); }
  else if (ac === 'excluir') {
    if (await confirmar('Excluir lançamento', 'Isso apaga o registro e o comprovante anexado. Não dá para desfazer.', 'Excluir')) {
      await Store.apagaLancamento(id); toast('Lançamento excluído.');
    }
  } else if (ac === 'recusar') {
    abreModal('Recusar lançamento', '<p class="small muted" style="margin-top:0">O líder do setor vai ver este motivo no painel dele.</p>' +
      '<label class="f"><span>Motivo</span><textarea id="motivo" placeholder="Ex.: falta o comprovante fiscal"></textarea></label>',
      '<button class="btn ghost" data-c>Cancelar</button><button class="btn danger" data-ok>Recusar</button>', (bg, fechar) => {
        $('[data-c]', bg).addEventListener('click', fechar);
        $('[data-ok]', bg).addEventListener('click', async () => {
          await Store.gravaLancamento(Object.assign({}, l, { status: 'rejeitado', obs: $('#motivo', bg).value.trim() }));
          fechar(); toast('Lançamento recusado.'); App.render();
        });
      });
    return;
  }
  App.render();
}

async function verAnexo(lancId, idx) {
  const l = Store.lancamentos.find(x => x.id === lancId);
  if (!l) return;
  const meta = (l.anexos || [])[idx];
  if (!meta) return;
  const fonte = await Store.leAnexo(meta);
  if (!fonte) return toast('Comprovante não encontrado.', 'bad');
  const ehImg = /^image\//.test(meta.tipo || '') || /^data:image/.test(fonte);
  abreModal(meta.nome || 'Comprovante',
    ehImg ? '<img src="' + fonte + '" alt="Comprovante" style="width:100%;border-radius:10px">'
      : '<p>Arquivo <b>' + esc(meta.tipo || '') + '</b>.</p><p><a href="' + fonte + '" target="_blank" rel="noopener">Abrir o comprovante em outra aba</a></p>',
    '<button class="btn ghost" data-c>Fechar</button>', (bg, fechar) => $('[data-c]', bg).addEventListener('click', fechar));
}

function paraCSV(linhas) {
  return '\uFEFF' + linhas.map(l => l.map(v => {
    const s = String(v == null ? '' : v).replace(/"/g, '""');
    return /[;"\n]/.test(s) ? '"' + s + '"' : s;
  }).join(';')).join('\n');
}
function exportaCSV(tipo) {
  const c = calcular();
  if (tipo === 'setores') {
    const l = [['Setor', 'Responsavel', 'Modo', 'Orcamento', 'Aprovado', 'Aguardando', 'Saldo', '% usado']];
    c.setores.forEach(s => l.push([s.nome, s.responsavel || '', s.tipo, s.orcamento.toFixed(2), s.aprovado.toFixed(2), s.pendente.toFixed(2), s.saldo.toFixed(2), s.consumo.toFixed(1)]));
    Store.baixar('adorar-te-2027-setores.csv', paraCSV(l));
  } else {
    const l = [['Data', 'Setor', 'Descricao', 'Categoria', 'Fornecedor', 'Pagamento', 'Valor', 'Status', 'Justificativa', 'Reembolso', 'Chave/Conta', 'Titular', 'Pago']];
    Store.lancamentos.slice().sort((a, b) => (a.data || '').localeCompare(b.data || '')).forEach(x => {
      const r = x.reembolso || {};
      l.push([dataBR(x.data), nomeSetor(x.setor), x.descricao, x.categoria || '', x.fornecedor || '', x.pagamento || '',
      (Number(x.valor) || 0).toFixed(2), x.status || 'pendente', x.justificativa || '',
      r.necessita ? 'sim' : 'nao', r.necessita ? (r.tipo === 'conta' ? (r.banco || '') + ' ag ' + (r.agencia || '') + ' cc ' + (r.conta || '') : r.chave || '') : '',
      r.titular || '', r.pago ? 'sim' : 'nao']);
    });
    Store.baixar('adorar-te-2027-lancamentos.csv', paraCSV(l));
  }
  toast('Arquivo gerado.', 'good');
}

function ligaGestao() {
  ligaCasca();
  ligaCampos();
  const aba = App.aba || 'painel';

  $$('[data-inc]').forEach(b => b.addEventListener('click', async () => {
    const i = Number(b.dataset.inc), d = Number(b.dataset.d);
    await Store.salvaCore(core => { core.lotes[i].vendidos = Math.max(0, (Number(core.lotes[i].vendidos) || 0) + d); return core; });
    App.render();
  }));

  const sim = $('#sim');
  if (sim) {
    const c = calcular();
    const pintar = () => {
      const extra = Number(sim.value);
      const preco = c.lotes.length ? c.lotes[c.lotes.length - 1].preco : 0;
      const receitaNova = c.receitaTotal + extra * preco;
      const taxaNova = (c.receitaIngressos + extra * preco) * c.taxaAdm;
      const inscritosNovo = c.inscritos + extra;
      const setoresNovo = soma(Store.core.setores, s => s.tipo === 'percentual' ? (Number(s.percentual) || 0) / 100 * receitaNova
        : s.tipo === 'porInscrito' ? (Number(s.porInscrito) || 0) * inscritosNovo : (Number(s.valor) || 0)) + soma(c.setores, s => s.aporte);
      const resultado = receitaNova - (setoresNovo + c.custoIsencoes + taxaNova + c.reserva);
      $('#simOut').innerHTML = '<div class="tw"><table>' +
        '<tr><td>Inscritos</td><td class="num">' + int(inscritosNovo) + '</td></tr>' +
        '<tr><td>Receita</td><td class="num">' + money(receitaNova) + '</td></tr>' +
        '<tr><td>Verba total dos setores</td><td class="num">' + money(setoresNovo) + '</td></tr>' +
        '<tr class="tfoot"><td>Resultado projetado</td><td class="num ' + (resultado >= 0 ? 'pos' : 'negv') + '">' + money(resultado) + '</td></tr>' +
        '<tr><td class="small muted">Diferença sobre hoje</td><td class="num small">' + money(resultado - c.resultadoProjetado) + '</td></tr>' +
        '</table></div>';
    };
    sim.addEventListener('input', pintar); pintar();
  }

  $$('[data-setor]').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('input,select,button')) return;
    modalSetor(el.dataset.setor);
  }));

  $$('[data-ac]').forEach(b => b.addEventListener('click', () => acaoLancamento(b.dataset.ac, b.dataset.id)));
  $$('[data-anexo]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const p = a.dataset.anexo.split(':'); verAnexo(p[0], Number(p[1]));
  }));
  $$('[data-csv]').forEach(b => b.addEventListener('click', () => exportaCSV(b.dataset.csv)));

  if (aba === 'lancamentos') {
    const fs = $('#fSetor'), ft = $('#fStatus'), fb = $('#fBusca');
    fs.addEventListener('change', () => { App.filtros.setor = fs.value; App.render(); });
    ft.addEventListener('change', () => { App.filtros.status = ft.value; App.render(); });
    let t; fb.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { App.filtros.busca = fb.value; App.render(); const n = $('#fBusca'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 450); });
  }

  const eSalvar = $('#eSalvar');
  if (eSalvar) eSalvar.addEventListener('click', async () => {
    const desc = $('#eDesc').value.trim(), valor = parseNum($('#eValor').value);
    if (!desc || valor <= 0) return toast('Informe descrição e valor.', 'bad');
    await Store.gravaEntrada({
      id: uid('ent'), descricao: desc, valor, data: $('#eData').value || hoje(),
      tipo: $('#eTipo').value, status: $('#eStatus').value, setor: $('#eSetor').value, criadoEm: new Date().toISOString()
    });
    toast('Entrada registrada.', 'good'); App.render();
  });
  $$('[data-entrada-x]').forEach(b => b.addEventListener('click', async () => {
    if (await confirmar('Excluir entrada', 'A receita deixa de contar no orçamento.', 'Excluir')) { await Store.apagaEntrada(b.dataset.entradaX); App.render(); }
  }));

  const addLote = $('#addLote');
  if (addLote) addLote.addEventListener('click', async () => {
    await Store.salvaCore(core => { core.lotes.push({ id: uid('lote'), nome: 'Novo lote', preco: 0, meta: 0, vendidos: 0 }); return core; });
    App.render();
  });
  $$('[data-lote-x]').forEach(b => b.addEventListener('click', async () => {
    if (!(await confirmar('Remover lote', 'Os inscritos desse lote saem da conta da receita.', 'Remover'))) return;
    await Store.salvaCore(core => { core.lotes.splice(Number(b.dataset.loteX), 1); return core; });
    App.render();
  }));
  const addSetor = $('#addSetor');
  if (addSetor) addSetor.addEventListener('click', async () => {
    const n = Store.core.setores.length;
    await Store.salvaCore(core => {
      core.setores.push({ id: uid('set'), nome: 'Novo setor', login: 'setor' + (n + 1), tipo: 'fixo', valor: 0, porInscrito: 0, percentual: 0, cor: CORES[n % CORES.length], responsavel: '', contato: '', pix: '' });
      return core;
    });
    App.render();
  });
  $$('[data-setor-x]').forEach(b => b.addEventListener('click', async () => {
    const i = Number(b.dataset.setorX), s = Store.core.setores[i];
    const usados = Store.lancamentos.filter(l => l.setor === s.id).length;
    if (!(await confirmar('Remover ' + s.nome, usados ? 'Este setor tem ' + usados + ' lançamento(s). Eles ficam órfãos no histórico.' : 'O setor sai da plataforma e o login deixa de funcionar.', 'Remover'))) return;
    await Store.salvaCore(core => { core.setores.splice(i, 1); return core; });
    App.render();
  }));

  const exp = $('#expJson');
  if (exp) exp.addEventListener('click', () => {
    const pacote = { gerado: new Date().toISOString(), core: Store.core, lancamentos: Store.lancamentos, entradas: Store.entradas };
    Store.baixar('adorar-te-2027-backup.json', JSON.stringify(pacote, null, 2), 'application/json');
    toast('Backup gerado.', 'good');
  });
  const imp = $('#impJson');
  if (imp) imp.addEventListener('change', async () => {
    const f = imp.files && imp.files[0]; if (!f) return;
    try {
      const txt = await f.text(), d = JSON.parse(txt);
      if (!d.core) throw new Error('arquivo inválido');
      if (!(await confirmar('Restaurar backup', 'O orçamento atual será substituído pelo conteúdo do arquivo.', 'Restaurar'))) return;
      await Store.salvaCore(d.core);
      for (const l of (d.lancamentos || [])) await Store.gravaLancamento(l);
      for (const e of (d.entradas || [])) await Store.gravaEntrada(e);
      toast('Backup restaurado.', 'good'); App.render();
    } catch (e) { toast('Não consegui ler esse arquivo.', 'bad'); }
  });
  const reset = $('#resetTudo');
  if (reset) reset.addEventListener('click', async () => {
    if (!(await confirmar('Voltar aos valores iniciais', 'Lotes, setores e premissas voltam aos números da planilha original. Os lançamentos são mantidos.', 'Restaurar'))) return;
    await Store.salvaCore(clone(DEFAULT_CORE)); toast('Orçamento restaurado.', 'good'); App.render();
  });
}

/* ---------------------------------------------------------------- painel do setor */
const ABAS_SETOR = [
  { id: 'painel', nome: 'Meu painel' },
  { id: 'novo', nome: 'Lançar gasto' },
  { id: 'meus', nome: 'Meus lançamentos' },
  { id: 'dados', nome: 'Meus dados' }
];

function telaSetor() {
  const c = calcular();
  const s = c.setores.find(x => x.id === App.sessao.setorId);
  if (!s) return telaLogin('setor');
  const aba = App.aba || 'painel';
  const abas = ABAS_SETOR.map(a => a.id === 'meus' && s.pendentesQtd ? Object.assign({}, a, { badge: s.pendentesQtd }) : a);
  let corpo = '';
  if (aba === 'painel') corpo = sPainel(s, c);
  else if (aba === 'novo') corpo = sNovo(s, c);
  else if (aba === 'meus') corpo = sMeus(s);
  else corpo = sDados(s);
  return casca(s.nome, 'Painel do setor · ' + s.nome, abas, aba, corpo);
}

function sPainel(s, c) {
  const recusados = s.lancamentos.filter(l => l.status === 'rejeitado');
  const porCategoria = {};
  s.lancamentos.filter(l => l.status !== 'rejeitado').forEach(l => {
    const k = l.categoria || 'Outros'; porCategoria[k] = (porCategoria[k] || 0) + (Number(l.valor) || 0);
  });
  const cats = Object.keys(porCategoria).map((k, i) => ({ nome: k, valor: porCategoria[k], cor: CORES[i % CORES.length] })).sort((a, b) => b.valor - a.valor);
  const ultimos = s.lancamentos.slice().sort((a, b) => (b.criadoEm || '').localeCompare(a.criadoEm || '')).slice(0, 4);
  const pctAprov = s.orcamento > 0 ? Math.min(100, s.aprovado / s.orcamento * 100) : 0;
  const pctPend = s.orcamento > 0 ? Math.min(100 - pctAprov, s.pendente / s.orcamento * 100) : 0;

  return '<div class="caixa">' +
    '<div class="lab">Saldo disponível para o setor ' + esc(s.nome)+'</div>' +
    '<div class="big ' + (s.saldo < 0 ? 'neg' : '') + '">' + money(s.saldo) + '</div>' +
    '<div class="sub">de ' + money(s.orcamento) + ' de verba' + (s.aporte ? ' (inclui ' + money(s.aporte) + ' em aportes)' : '') + '</div>' +
    '<div class="meter"><i class="a" style="width:' + pctAprov + '%"></i><i class="b" style="width:' + pctPend + '%"></i></div>' +
    '<div class="legend"><span><b>' + money(s.aprovado) + '</b> aprovado</span><span><b>' + money(s.pendente) + '</b> aguardando análise</span><span><b>' + pct(s.consumo) + '</b> da verba usada</span></div>' +
    '</div>' +
    '<div class="kpis mt">' +
    kpi('Como sua verba é calculada', s.tipo === 'fixo' ? 'Valor fixo' : s.tipo === 'percentual' ? pct(s.percentual) + ' da receita' : money(s.porInscrito) + ' por inscrito',
      s.tipo === 'porInscrito' ? int(c.inscritos) + ' inscritos hoje' : s.tipo === 'percentual' ? 'receita de ' + money0(c.receitaTotal) : 'definido pela coordenação') +
    kpi('Lançamentos', int(s.qtd), s.pendentesQtd ? s.pendentesQtd + ' aguardando análise' : 'nenhum pendente') +
    kpi('A receber de volta', money(s.aReembolsar), s.qtdReembolsos ? s.qtdReembolsos + ' reembolso(s) em aberto' : 'nada em aberto') +
    kpi('Inscritos no evento', int(c.inscritos), 'meta de ' + int(c.metaInscritos)) +
    '</div>' +
    (recusados.length ? '<div class="alert bad mt"><span>▲</span><div><b>' + recusados.length + ' lançamento(s) recusado(s).</b> Veja o motivo em Meus lançamentos e reenvie com a correção.</div></div>' : '') +
    (s.saldo < 0 ? '<div class="alert bad mt"><span>▲</span><div>Seu setor passou da verba em <b>' + money(Math.abs(s.saldo)) + '</b>. Fale com a coordenação antes de novos gastos.</div></div>'
      : s.consumo > 85 ? '<div class="alert warn mt"><span>●</span><div>Você já usou ' + pct(s.consumo) + ' da verba. Restam ' + money(s.saldo) + '.</div></div>' : '') +
    '<div class="split mt">' +
    '<div class="card"><div class="card-head"><h3>Últimos lançamentos</h3><button class="btn ghost sm" data-ir="meus">Ver todos</button></div><div class="card-body">' +
    (ultimos.length ? ultimos.map(l => cartaoLancamento(l, false)).join('') : '<div class="empty"><b>Seu caixa está zerado de gastos</b>Quando lançar a primeira despesa, ela aparece aqui.<div class="mt"><button class="btn gold sm" data-ir="novo">Lançar o primeiro gasto</button></div></div>') +
    '</div></div>' +
    '<div class="card"><div class="card-head"><h3>Gasto por categoria</h3></div><div class="card-body">' +
    (cats.length ? donut(cats, 'lançado', money0(s.comprometido)) + '<div class="legend-row">' + cats.map(x => '<span><i style="background:' + x.cor + '"></i>' + esc(x.nome) + ' · ' + money0(x.valor) + '</span>').join('') + '</div>'
      : '<div class="empty small">Sem gastos lançados até agora.</div>') +
    '</div></div></div>';
}

function sNovo(s, c) {
  const ed = App.editando ? Store.lancamentos.find(l => l.id === App.editando) : null;
  const r = (ed && ed.reembolso) || {};
  const val = (k, fb) => esc(ed ? (ed[k] == null ? '' : ed[k]) : (fb || ''));
  return '<div class="sec-title"><h2>' + (ed ? 'Corrigir lançamento' : 'Lançar um gasto') + '</h2><p>Saldo disponível agora: <b>' + money(s.saldo) + '</b>.</p></div>' +
    '<div class="split"><div class="card"><div class="card-body">' +
    '<div class="grid2">' +
    '<label class="f"><span>Data do gasto</span><input type="date" id="gData" value="' + (ed ? esc(ed.data) : hoje()) + '"></label>' +
    '<label class="f"><span>Valor</span><input class="inp" id="gValor" placeholder="0,00" value="' + (ed ? String(Number(ed.valor).toFixed(2)).replace('.', ',') : '') + '"></label>' +
    '</div>' +
    '<label class="f"><span>O que foi comprado ou contratado</span><input class="inp" id="gDesc" placeholder="Ex.: 200 camisetas do staff" value="' + val('descricao') + '"></label>' +
    '<div class="grid3">' +
    '<label class="f"><span>Categoria</span><select id="gCat">' + CATEGORIAS.map(x => '<option' + (ed && ed.categoria === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></label>' +
    '<label class="f"><span>Fornecedor</span><input class="inp" id="gForn" placeholder="Nome da loja" value="' + val('fornecedor') + '"></label>' +
    '<label class="f"><span>Forma de pagamento</span><select id="gPag">' + PAGAMENTOS.map(x => '<option' + (ed && ed.pagamento === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></label>' +
    '</div>' +
    '<label class="f"><span>Justificativa</span><textarea id="gJust" placeholder="Por que este gasto foi necessário, quantidades, para quem…">' + val('justificativa') + '</textarea></label>' +
    '<label class="f"><span>Nota fiscal ou comprovante</span><input type="file" id="gArq" accept="image/*,application/pdf" multiple capture="environment"><p class="hint">Fotos são compactadas automaticamente. Pode anexar mais de um arquivo.</p></label>' +
    '<div id="listaArq" class="anexos"></div>' +
    '<div class="divider"></div>' +
    '<label class="f" style="display:flex;gap:10px;align-items:flex-start">' +
    '<input type="checkbox" id="gReemb" style="width:auto;margin-top:3px"' + (r.necessita ? ' checked' : '') + '>' +
    '<span style="margin:0"><b>Paguei do meu bolso e preciso ser ressarcido</b><br><span class="hint">Informe abaixo para onde a coordenação deve devolver o valor.</span></span></label>' +
    '<div id="boxReemb" style="display:' + (r.necessita ? 'block' : 'none') + '">' +
    '<div class="grid2">' +
    '<label class="f"><span>Forma de devolução</span><select id="rTipo"><option value="pix"' + (r.tipo !== 'conta' ? ' selected' : '') + '>Pix</option><option value="conta"' + (r.tipo === 'conta' ? ' selected' : '') + '>Conta bancária</option></select></label>' +
    '<label class="f"><span>Titular</span><input class="inp" id="rTitular" value="' + esc(r.titular || s.responsavel || '') + '"></label>' +
    '</div>' +
    '<div id="boxPix" style="display:' + (r.tipo === 'conta' ? 'none' : 'block') + '">' +
    '<label class="f"><span>Chave Pix</span><input class="inp" id="rChave" placeholder="CPF, telefone, e-mail ou chave aleatória" value="' + esc(r.chave || s.pix || '') + '"></label></div>' +
    '<div id="boxConta" style="display:' + (r.tipo === 'conta' ? 'block' : 'none') + '"><div class="grid3">' +
    '<label class="f"><span>Banco</span><input class="inp" id="rBanco" value="' + esc(r.banco || '') + '"></label>' +
    '<label class="f"><span>Agência</span><input class="inp" id="rAg" value="' + esc(r.agencia || '') + '"></label>' +
    '<label class="f"><span>Conta</span><input class="inp" id="rConta" value="' + esc(r.conta || '') + '"></label>' +
    '</div></div></div>' +
    '<div class="row mt"><button class="btn gold" id="gSalvar">' + (ed ? 'Reenviar para análise' : 'Enviar lançamento') + '</button>' +
    (ed ? '<button class="btn ghost" id="gCancelar">Cancelar</button>' : '') +
    '<span class="small muted" id="gAviso"></span></div>' +
    '</div></div>' +
    '<div class="card pad"><h3>Como funciona</h3><div class="divider"></div>' +
    '<p class="small">O lançamento já desconta do seu saldo assim que enviado, mesmo antes da aprovação — assim ninguém gasta duas vezes o mesmo dinheiro.</p>' +
    '<p class="small">A coordenação analisa, aprova ou pede correção. Se você pagou do próprio bolso, o reembolso entra na fila com seus dados de Pix.</p>' +
    '<div class="divider"></div>' +
    '<div class="tw"><table>' +
    '<tr><td>Verba do setor</td><td class="num">' + money(s.orcamento) + '</td></tr>' +
    '<tr><td>Já lançado</td><td class="num">' + money(s.comprometido) + '</td></tr>' +
    '<tr class="tfoot"><td>Disponível</td><td class="num ' + (s.saldo < 0 ? 'negv' : 'pos') + '">' + money(s.saldo) + '</td></tr>' +
    '</table></div></div></div>';
}

function sMeus(s) {
  const lista = s.lancamentos.slice().sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  return '<div class="sec-title"><h2>Meus lançamentos</h2><p>' + lista.length + ' registro(s) · ' + money(s.comprometido) + ' lançado.</p></div>' +
    (lista.length ? lista.map(l => cartaoLancamento(l, false, '<div class="acts">' +
      (l.status !== 'aprovado'
        ? '<button class="btn sm ghost" data-edit="' + l.id + '">Editar</button><button class="btn sm ghost" data-del="' + l.id + '">Excluir</button>'
        : '<span class="small muted">Aprovado pela coordenação — fale com ela para alterar.</span>') +
      '</div>')).join('')
      : '<div class="card"><div class="empty"><b>Nenhum lançamento ainda</b>Registre o primeiro gasto do setor.<div class="mt"><button class="btn gold sm" data-ir="novo">Lançar gasto</button></div></div></div>');
}

function sDados(s) {
  return '<div class="sec-title"><h2>Meus dados</h2><p>Usados pela coordenação para falar com você e devolver valores adiantados.</p></div>' +
    '<div class="split"><div class="card"><div class="card-body">' +
    '<div class="grid2">' +
    '<label class="f"><span>Responsável pelo setor</span><input class="inp" id="dResp" value="' + esc(s.responsavel || '') + '"></label>' +
    '<label class="f"><span>WhatsApp ou e-mail</span><input class="inp" id="dCont" value="' + esc(s.contato || '') + '"></label>' +
    '</div>' +
    '<label class="f"><span>Chave Pix padrão para reembolsos</span><input class="inp" id="dPix" value="' + esc(s.pix || '') + '"><p class="hint">Ela já vem preenchida quando você marcar um gasto como reembolsável.</p></label>' +
    '<button class="btn gold" id="dSalvar">Salvar meus dados</button>' +
    '</div></div>' +
    '<div class="card pad"><h3>Acesso</h3><div class="divider"></div>' +
    '<p class="small">Login do setor: <b>' + esc(s.login || s.id) + '</b></p>' +
    '<p class="small">Senha: definida pela coordenação.</p>' +
    '<p class="small muted">Este painel mostra apenas os dados do setor ' + esc(s.nome) + '. Números de outros setores ficam com a coordenação.</p>' +
    '</div></div>';
}

/* ------------------------------------------------ ligações do painel do setor */
let anexosPendentes = [];

function ligaSetor() {
  ligaCasca();
  const c = calcular();
  const s = c.setores.find(x => x.id === App.sessao.setorId);
  if (!s) return;
  const aba = App.aba || 'painel';

  $$('[data-ir]').forEach(b => b.addEventListener('click', () => { App.aba = b.dataset.ir; App.render(); }));
  $$('[data-anexo]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); const p = a.dataset.anexo.split(':'); verAnexo(p[0], Number(p[1])); }));
  $$('[data-edit]').forEach(b => b.addEventListener('click', () => { App.editando = b.dataset.edit; App.aba = 'novo'; anexosPendentes = []; App.render(); }));
  $$('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (await confirmar('Excluir lançamento', 'O valor volta para o seu saldo.', 'Excluir')) { await Store.apagaLancamento(b.dataset.del); toast('Lançamento excluído.'); App.render(); }
  }));

  if (aba === 'dados') {
    $('#dSalvar').addEventListener('click', async () => {
      const resp = $('#dResp').value.trim(), cont = $('#dCont').value.trim(), pix = $('#dPix').value.trim();
      await Store.salvaCore(core => {
        const alvo = core.setores.find(x => x.id === s.id);
        if (alvo) { alvo.responsavel = resp; alvo.contato = cont; alvo.pix = pix; }
        return core;
      });
      toast('Dados salvos.', 'good'); App.render();
    });
  }

  if (aba !== 'novo') return;

  const ed = App.editando ? Store.lancamentos.find(l => l.id === App.editando) : null;
  if (ed && !anexosPendentes.length) anexosPendentes = (ed.anexos || []).slice();
  if (!ed && App.editando) App.editando = null;

  const pintaArquivos = () => {
    $('#listaArq').innerHTML = anexosPendentes.length
      ? anexosPendentes.map((a, i) => '<span class="anexo">📎 ' + esc(a.nome) + ' <button class="btn sm ghost" data-rm="' + i + '" style="padding:0 6px;margin-left:4px">✕</button></span>').join('')
      : '<span class="small muted">Nenhum arquivo anexado.</span>';
    $$('[data-rm]').forEach(b => b.addEventListener('click', () => { anexosPendentes.splice(Number(b.dataset.rm), 1); pintaArquivos(); }));
  };
  pintaArquivos();

  $('#gArq').addEventListener('change', async e => {
    const arquivos = Array.from(e.target.files || []);
    e.target.value = '';
    for (const f of arquivos) {
      try {
        $('#gAviso').textContent = 'Enviando ' + f.name + '…';
        const meta = await Store.enviaAnexo(f);
        anexosPendentes.push(meta);
        pintaArquivos();
      } catch (err) { toast(err.message || 'Não consegui anexar esse arquivo.', 'bad'); }
    }
    $('#gAviso').textContent = '';
  });

  const reemb = $('#gReemb'), box = $('#boxReemb'), rTipo = $('#rTipo');
  reemb.addEventListener('change', () => { box.style.display = reemb.checked ? 'block' : 'none'; });
  rTipo.addEventListener('change', () => {
    $('#boxPix').style.display = rTipo.value === 'conta' ? 'none' : 'block';
    $('#boxConta').style.display = rTipo.value === 'conta' ? 'block' : 'none';
  });

  const cancelar = $('#gCancelar');
  if (cancelar) cancelar.addEventListener('click', () => { App.editando = null; anexosPendentes = []; App.aba = 'meus'; App.render(); });

  $('#gSalvar').addEventListener('click', async () => {
    const valor = parseNum($('#gValor').value);
    const desc = $('#gDesc').value.trim();
    if (!desc) return toast('Descreva o que foi comprado.', 'bad');
    if (valor <= 0) return toast('Informe um valor maior que zero.', 'bad');
    const restante = s.saldo + (ed ? Number(ed.valor) || 0 : 0);
    if (valor > restante) {
      const ok = await confirmar('Acima do saldo', 'Este gasto de ' + money(valor) + ' passa ' + money(valor - restante) + ' do saldo do setor. A coordenação verá o estouro ao analisar.', 'Enviar assim mesmo');
      if (!ok) return;
    }
    const obj = {
      id: ed ? ed.id : uid('lan'),
      setor: s.id,
      data: $('#gData').value || hoje(),
      valor,
      descricao: desc,
      categoria: $('#gCat').value,
      fornecedor: $('#gForn').value.trim(),
      pagamento: $('#gPag').value,
      justificativa: $('#gJust').value.trim(),
      anexos: anexosPendentes.slice(),
      status: 'pendente',
      obs: '',
      criadoEm: ed ? ed.criadoEm : new Date().toISOString(),
      atualizadoEm: new Date().toISOString(),
      reembolso: reemb.checked ? {
        necessita: true,
        tipo: rTipo.value,
        titular: $('#rTitular').value.trim(),
        chave: rTipo.value === 'conta' ? '' : $('#rChave').value.trim(),
        banco: rTipo.value === 'conta' ? $('#rBanco').value.trim() : '',
        agencia: rTipo.value === 'conta' ? $('#rAg').value.trim() : '',
        conta: rTipo.value === 'conta' ? $('#rConta').value.trim() : '',
        pago: (ed && ed.reembolso && ed.reembolso.pago) || false
      } : { necessita: false }
    };
    await Store.gravaLancamento(obj);
    anexosPendentes = []; App.editando = null;
    toast(ed ? 'Lançamento reenviado.' : 'Lançamento enviado para análise.', 'good');
    App.aba = 'meus'; App.render();
  });
}

/* ---------------------------------------------------------------- inicialização */
(function () {
  try { const t = localStorage.getItem('at27:tema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  window.addEventListener('hashchange', () => { App.lerRota(); App.render(); });
  App.lerRota();
  Store.assina(() => agendaRender());
  Store.iniciar().then(() => { App.lerRota(); App.render(); }).catch(e => {
    console.error(e);
    Store.pronto = true; Store.iniciarLocal(); App.render();
  });
})();
</script>
